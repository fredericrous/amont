[workspace]
resolver = "2"
members = ["crates/amont", "crates/amont-fleet", "crates/amont-runtime"]

# The floor for the COMMIT PATH — `amont` and `amont-runtime`, which
# inherit this. Not a guess: 1.73 was run against those two crates and failed
# with four errors, all of them `E0658: use of unstable library feature
# 'io_error_other'`, on `std::io::Error::other` in staged_only.rs; 1.74.0
# compiles them clean. Everything else the source reaches for is older —
# `OnceLock` and `is_some_and` are 1.70, let-else is 1.65.
#
# `amont-fleet` deliberately does NOT inherit it and states a much higher
# floor of its own; see its manifest for why. Declaring 1.74 workspace-wide
# would have been a claim nothing could honour.
#
# CI's `msrv` job is what keeps this honest. A `rust-version` nobody compiles
# against is a comment with extra syntax.
[workspace.package]
rust-version = "1.74"

# Published metadata, shared so the three crates cannot disagree about who they
# are. `version` is here because they are released together: `amont` depends
# on `amont-runtime`, and crates.io resolves that by VERSION, not by path, so
# a release where the two disagree is a release nobody can install.
version = "1.26.0"
license = "MIT"
repository = "https://github.com/fredericrous/amont"
authors = ["Frederic Rousseau"]
edition = "2021"

# The one place the inter-crate version is written.
#
# `amont` and `amont-fleet` both depend on `amont-runtime`, and
# crates.io resolves that by VERSION while a checkout resolves it by PATH — so
# a manifest carrying its own literal is a release where the two can disagree,
# which is a release nobody can install. Bumping [workspace.package] version
# above is now the whole edit.
[workspace.dependencies]
amont-runtime = { path = "crates/amont-runtime", version = "1.24.0" }

# Shared release posture. The hook binary runs on every commit, so size and
# start-up cost are features.
[profile.release]
strip = true
opt-level = "s"
lto = true

# NO `panic = "abort"` here, and it must not come back. It saved 10-20KB on a
# ~583KB binary and silently disabled two safety nets that only exist in the
# shipped build:
#
#   * `dispatch::run_concurrently`'s `catch_unwind`, which isolates one
#     panicking check so the other nineteen still report. Under abort, a panic
#     in any check takes the whole hook down with it.
#   * `Drop for StagedOnly`, which puts the author's unstaged work back. Drop
#     does not run on abort, so a panicking check left that work parked in
#     `$GIT_DIR/amont-held` — the loss staged_only.rs calls the worst
#     failure in this repository.
#
# The sharp part is that no test can catch the regression: cargo IGNORES the
# `panic` setting for test targets, so both panic tests pass identically with
# or without this line. `crates/amont/tests/release_profile.rs` reads this
# file instead, because asserting on the manifest is the only mechanism that
# can see a setting the test profile discards.
