name: CI

# These hooks stand between the author and every commit/push in ~96 repos, so a
# broken one is felt immediately and everywhere. `make test` was dev-machine
# only until now; this runs it on every push and PR.
#
# Matrix on purpose: the hooks ship to a macOS workstation but also run on Linux
# CI runners, and they lean on tools whose flags differ by platform (BSD vs GNU
# realpath/grep/sed — the ban-terms hook already carries a comment about POSIX
# regex flavour varying). A single-platform run would let that class of break
# through.

on:
  push:
    branches: ["main"]
  pull_request:
  # For `audit` above all. A new advisory against a crate in the fleet's tree
  # appears without anybody pushing anything, so a push-only workflow learns
  # about it whenever the next commit happens to land — which in a repository
  # that changes in bursts can be months. Monday morning, so a finding is read
  # at the start of a week rather than discovered on a Friday.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub's DEFAULT shell is `bash -e {0}` — no pipefail. Only naming bash
# explicitly gets `bash -eo pipefail {0}`. Without this, `make test | tee`
# reports the exit status of `tee` (always 0) and a failing suite goes GREEN.
# That is exactly what the first run of this workflow did: both jobs passed
# while `make` had printed "*** [test] Error 1".
defaults:
  run:
    shell: bash

jobs:
  deps:
    name: hook binary has no external dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Supply chain: this binary runs on every commit with the developer's
      # credentials, so every transitive crate is code running in that
      # position. A dependency reaches the commit path through
      # amont-runtime as easily as directly, so this checks the RESOLVED
      # tree. See scripts/check-no-deps.sh for why, and for when overriding it
      # is a reasonable call rather than a violation.
      - run: ./scripts/check-no-deps.sh
      # And prove the guard can still say no. It used to swallow cargo's stderr
      # and end with `|| true`, so every way of FAILING to answer the question
      # produced the same green line as a clean tree — this job included. A
      # check that cannot fail is indistinguishable from one that is not run,
      # so run it once in a directory with no workspace and require a refusal.
      - name: the guard fails closed when it cannot answer
        run: |
          if (cd /tmp && "$GITHUB_WORKSPACE/scripts/check-no-deps.sh"); then
            echo "::error::check-no-deps.sh passed without verifying anything"
            exit 1
          fi
          echo "refused, as it should"

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # The behavioural coverage lives in the integration tests under tests/;
      # these two just keep the source honest.
      #
      # `make lint` runs EXACTLY these two, so a contributor can reproduce a red
      # `rust` job without pushing. If you change a flag here, change it there —
      # and read the warning in that target about the THIRD, stricter clippy the
      # repo's own pre-commit hook runs.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # The floor `rust-version` claims, compiled against.
  #
  # `-D warnings` on a floating stable is the reason `rust-toolchain.toml`
  # pins the BUILD toolchain; this job is the other half — the oldest toolchain
  # the source is allowed to require. Without it, `rust-version = "1.74"` is a
  # string in a manifest that nothing ever tests, and the first use of a 1.80
  # API would sail through every other job here.
  #
  # Only the COMMIT PATH is checked, and deliberately: `amont-fleet` declares
  # a floor of its own (1.88, forced by ratatui's tree) and could not build here.
  msrv:
    # Literal, not `${{ env.MSRV }}` — the `env` context is not available in a
    # job's `name`, and an unresolvable expression there renders as an empty
    # string rather than erroring.
    name: msrv (the commit path builds on 1.74)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep in step with [workspace.package] rust-version in Cargo.toml.
      MSRV: "1.74.0"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$MSRV" --profile minimal --no-self-update
      - name: cargo +MSRV check (amont, amont-runtime)
        run: |
          set -euo pipefail
          # Cargo 1.74 cannot PARSE a v4 lock file ("lock file version `4` was
          # found"), which is what the committed one is, so it fails before it
          # reaches any Rust at all. Removing it is safe and is not a weakening
          # of the check: the two crates being checked have no external
          # dependencies whatsoever — that is the property the `deps` job
          # exists to enforce — so there is nothing for a lock file to pin.
          # The checkout is disposable; nothing is committed back.
          rm -f Cargo.lock
          cargo "+$MSRV" check -p amont -p amont-runtime

  # The workspace's one dependency tree, watched.
  #
  # `amont` is dependency-free by policy and `deps` proves it, so the only
  # crate with a supply chain to monitor is `amont-fleet` (~57 packages:
  # ratatui, crossterm, serde). Leaving the single crate that HAS a tree
  # unwatched, in a repository whose headline dependency argument is supply
  # chain, is the asymmetry this closes.
  #
  # `cargo install --locked cargo-audit`, NOT a marketplace action. Pulling an
  # unaudited third-party action — which runs with this workflow's token — into
  # the job whose entire purpose is supply-chain hygiene is self-defeating; the
  # install is slower and it is the point. `--locked` so cargo-audit builds from
  # its own published lock file rather than a fresh resolve.
  #
  # NON-BLOCKING, decided deliberately: an advisory is information about a
  # dependency, not a defect in the change under review, and a scheduled run
  # that goes red on somebody else's disclosure trains people to ignore red.
  # Findings surface as ::warning:: annotations instead.
  audit:
    name: cargo audit (advisory, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}
      - name: Install cargo-audit
        run: command -v cargo-audit > /dev/null || cargo install --locked cargo-audit
      # Two things about `cargo audit`'s exit code drive the shape of this, and
      # both were found by rehearsing it rather than by reading the docs:
      #
      #   1. It exits NON-ZERO for both "I found vulnerabilities" and "I could
      #      not fetch the advisory database". Those mean opposite things. The
      #      first draft announced a fetch failure as findings — reporting an
      #      inability to answer as an answer, the exact shape
      #      scripts/check-no-deps.sh was rewritten to stop doing.
      #   2. It exits ZERO for advisories classed as warnings — `unmaintained`
      #      and `unsound`. The tree has two of those today (RUSTSEC-2024-0436,
      #      paste, unmaintained; RUSTSEC-2026-0002, lru, unsound), so a step
      #      that keyed on the exit code alone would print "no advisories" over
      #      a log listing them.
      #
      # So the ADVISORY IDS decide, not the exit code, and the exit code only
      # says how loudly to phrase it.
      - name: Audit the resolved tree
        run: |
          set -uo pipefail
          cargo audit --color never 2>&1 | tee /tmp/audit.log
          rc=${PIPESTATUS[0]}
          ids=$(grep -Eo 'RUSTSEC-[0-9]{4}-[0-9]{4}' /tmp/audit.log | sort -u)

          if [ -z "$ids" ]; then
            if [ "$rc" -eq 0 ]; then
              echo "no advisories against the locked tree"
            else
              echo "::warning::cargo audit could not complete — the tree was NOT checked. This is not a clean result."
            fi
            exit 0
          fi

          if [ "$rc" -eq 0 ]; then
            echo "::warning::cargo audit: advisories against the locked tree (warnings — unmaintained/unsound)"
          else
            echo "::warning::cargo audit: VULNERABILITIES against the locked tree"
          fi
          # One annotation per id, so the run summary names them instead of
          # pointing at a wall of output.
          printf '%s\n' "$ids" | while read -r id; do
            echo "::warning::$id  https://rustsec.org/advisories/$id"
          done

          # Exit 0 on purpose. `continue-on-error` above already keeps the run
          # green; this keeps the STEP from being marked failed too, so the
          # annotations are the signal rather than a red X people learn to
          # ignore. The BLOCKING form of this job lives in release.yaml
          # (`audit`): same parsing, but a vulnerability or an unchecked
          # tree refuses the release.
          exit 0

  # The shims are the only shell left in this repository.
  #
  # This job used to bill itself as a "cheap backstop for the hooks no test file
  # covers (argo-lint, kube-linter, kubeconform, yamllint)". Those four have
  # been Rust since phase 3 and are covered by crates/amont/tests/k8s.rs and
  # crates/amont/tests/linters.rs; the comment outlived its subject by three
  # phases. It also dispatched on the shebang across four arms, of which the
  # `*zsh` and `*node` ones could never fire — no hook has been either since the
  # rename.
  #
  # What remains is worth keeping and is stated plainly: the shims must parse
  # under the POSIX `sh` that Git for Windows ships, which is the interpreter
  # they name and the one platform where a syntax error would surface as a
  # broken commit rather than a test failure. `sh -n` is the only thing here
  # that a cargo test cannot do.
  #
  # Naming and recognition are already covered elsewhere and are NOT re-tested
  # here: `registry`'s `the_shipped_shims_are_exactly_the_git_invoked_hooks`
  # asserts the set of filenames, and `hookfile::is_our_shim` covers identifying
  # one in the wild.
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: The shims parse as POSIX sh
        run: |
          rc=0
          for f in templates/hooks/*; do
            [ -f "$f" ] || continue
            case "$(head -1 "$f")" in
              */sh) sh -n "$f" || { echo "::error file=$f::sh parse error"; rc=1; } ;;
              # Not a fallthrough for hypothetical interpreters — an assertion.
              # One shim, one interpreter. If a hook ever needs another, that is
              # a decision to make in a PR, not something for this job to
              # quietly accommodate.
              *) echo "::error file=$f::expected a POSIX sh shebang, found: $(head -1 "$f")"; rc=1 ;;
            esac
          done
          exit $rc

      # The five shims are BYTE-IDENTICAL and always have been: one file serves
      # every hook, passing its own filename through so the binary knows which
      # hook to run. `sh -n` above parses each of them separately and would
      # happily pass five different files, so it cannot see a hand-edit made to
      # one copy — the likeliest way this set drifts, since fixing "the
      # pre-commit shim" and forgetting the other four is a natural mistake.
      # `cmp` is the assertion that earns this job its second step.
      - name: All five shims are byte-identical
        run: |
          rc=0
          ref=templates/hooks/pre-commit
          [ -f "$ref" ] || { echo "::error::$ref is missing"; exit 1; }
          for f in templates/hooks/*; do
            [ -f "$f" ] || continue
            cmp -s "$ref" "$f" || {
              echo "::error file=$f::differs from $ref — the shims must be one file, copied"
              diff -u "$ref" "$f" || true
              rc=1
            }
          done
          exit $rc

  # Windows is a first-class platform here, not a smoke test.
  #
  # It could not be, once: a real commit on Windows failed the moment any
  # applicable hook was a zsh script Git for Windows cannot execute, and the
  # test suites were themselves zsh, so this job could only prove that a commit
  # went through. Both halves are gone — the hooks are one binary behind `sh`
  # shims, and the suites are cargo integration tests — so Windows now runs
  # exactly the tests every other platform does, plus the two things only this
  # runner can answer: that a real `git commit` goes end to end through the
  # shims, and that an UNBAKED shim can find the binary with PATH emptied.
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # The full suite, not a smoke. No tool installs here on purpose: the
      # tool-gated cases skip, and what this job is for is the platform, not
      # the linters — those are covered on Linux and macOS by the `test` job,
      # which does install them and now fails if any of them is missing.
      - run: cargo test -- --show-output

      # The Windows installer, run for real on Windows.
      #
      # `install.sh` is POSIX sh and reaches this platform only through Git
      # Bash, so `install.ps1` is the documented path here — and a documented
      # install path nobody executes is how you find out it was broken from a
      # user's bug report. It installs the LATEST PUBLISHED release rather than
      # this build: the script is what is under test, the binary is a fixture,
      # and pinning it to the PR would test a tarball no user will ever fetch.
      #
      # Skipped until a release exists, since there is nothing to install from.
      - name: install.ps1 installs a real release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = $null
          try {
            $latest = Invoke-RestMethod `
              -Uri 'https://api.github.com/repos/${{ github.repository }}/releases/latest' `
              -Headers @{ 'User-Agent' = 'ci' }
          } catch {
            Write-Host '::notice::no published release yet - skipping the installer test'
            exit 0
          }

          # Same skip for a latest release that predates the rename to amont:
          # its assets carry the old name, and the script under test fetches
          # the new one. The first amont release reactivates this on its own.
          if (-not ($latest.assets | Where-Object { $_.name -like 'amont-*' })) {
            Write-Host '::notice::latest release predates the amont rename - skipping the installer test'
            exit 0
          }

          $bin = Join-Path $env:RUNNER_TEMP 'amont-bin'
          & "$PWD\install\install.ps1" -BinDir $bin -Version $latest.tag_name

          $exe = Join-Path $bin 'amont.exe'
          if (-not (Test-Path $exe)) { throw "install.ps1 did not produce $exe" }

          # It has to RUN, not merely exist — and answer as itself.
          $help = & $exe --help 2>&1 | Out-String
          if ($help -notmatch 'agents-md') { throw "the installed binary did not answer --help:`n$help" }

          # And it must have enabled nothing: no hooks anywhere, no global
          # init.templateDir. That restraint is the script's whole contract.
          $tpl = & git config --global --get init.templateDir 2>$null
          if ($LASTEXITCODE -eq 0 -and $tpl) { throw "install.ps1 set init.templateDir to $tpl" }

          Write-Host 'install.ps1: installed, runs, and enabled nothing'

          # `git config --get` exits 1 when the key is ABSENT, which is the
          # passing case here — and GitHub's pwsh wrapper ends with
          # `exit $LASTEXITCODE`, so that 1 became the step's result even
          # though every assertion had passed. Say what we mean instead of
          # inheriting the exit code of an incidental probe.
          exit 0

      - name: And a real commit runs end to end through the shims
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          BIN="$PWD/target/release/amont.exe"
          [ -x "$BIN" ] || BIN="$PWD/target/release/amont"

          repo=$(mktemp -d)/r && mkdir -p "$repo" && cd "$repo"
          # --template= (empty): without it `git init` copies the MACHINE's
          # installed hooks in and the smoke would test those, not these.
          git init -q --template= .
          git config user.email ci@example.com
          git config user.name "windows ci"

          mkdir -p .git/hooks
          for h in commit-msg prepare-commit-msg pre-commit post-commit; do
            cp "$GITHUB_WORKSPACE/templates/hooks/$h" ".git/hooks/$h"
            sed -i "s|__AMONT_BIN__|$BIN|g" ".git/hooks/$h"
            chmod +x ".git/hooks/$h"
          done

          # Ask for a gitmoji, so there is something visible for the hook to do
          # to the subject. The default placement is `none` — the message you
          # wrote is the message you get — which is right for a default and
          # useless as proof that anything ran. This also exercises the config
          # read itself on the one platform where its `git config` calls have
          # never been tried.
          git config amont.commit.gitmoji prefix

          echo "hello" > a.txt && git add a.txt
          git commit -m "feat: a windows commit through the rust hooks"

          # commit-msg must have rewritten the subject with the gitmoji prefix —
          # proof the hook ran and edited the message, not merely exited 0.
          # The commit must EXIST before its subject means anything: an empty
          # subject from a failed commit would otherwise satisfy a naive
          # "differs from the plain text" check.
          git rev-parse --verify HEAD > /dev/null 2>&1 \
            || { echo "::error::commit did not happen"; exit 1; }
          subject=$(git log -1 --format=%s)
          echo "subject: $subject"
          case "$subject" in
            *"feat: a windows commit through the rust hooks") ;;
            *) echo "::error::commit-msg did not run"; exit 1 ;;
          esac
          [ "$subject" = "feat: a windows commit through the rust hooks" ] \
            && { echo "::error::gitmoji prefix missing — hook did not rewrite"; exit 1; }

          # And the settings are readable through the CLI here too — `amont
          # setup` with no terminal must print the keys rather than hang or
          # fail, which is the path a Windows provisioning script would take.
          "$BIN" setup | grep -q "amont.commit.gitmoji" \
            || { echo "::error::amont setup printed no keys"; exit 1; }
          echo "windows end-to-end OK"

      # The case the baked run above cannot see. `make install` puts the binary
      # in ~/.local/bin, and a repo created from a template dir that IS the
      # checkout keeps the __AMONT_BIN__ placeholder — so the shim has to
      # resolve the binary itself, with PATH deliberately emptied because that
      # is what a GUI git client hands a hook.
      #
      # Windows builds amont.exe, and `[ -x .../amont ]` is false for it,
      # so this path fell through to PATH — the one thing the test removes. That
      # is the bug this step exists to keep fixed.
      - name: An UNBAKED shim resolves the binary without PATH
        shell: bash
        run: |
          set -euo pipefail
          BIN_SRC="$PWD/target/release/amont.exe"
          [ -f "$BIN_SRC" ] || BIN_SRC="$PWD/target/release/amont"
          mkdir -p "$HOME/.local/bin"
          cp "$BIN_SRC" "$HOME/.local/bin/$(basename "$BIN_SRC")"

          mkdir -p "$RUNNER_TEMP/unbaked" && cd "$RUNNER_TEMP/unbaked"
          git init -q --template= .
          git config user.email ci@example.com
          git config user.name "windows ci"

          mkdir -p .git/hooks
          cp "$GITHUB_WORKSPACE/templates/hooks/pre-commit" .git/hooks/pre-commit
          chmod +x .git/hooks/pre-commit
          # Unbaked on purpose — this is what git init from the checkout gives.
          grep -q '__AMONT_BIN__' .git/hooks/pre-commit \
            || { echo "::error::fixture was baked; the test proves nothing"; exit 1; }

          # A PATH with git and the shell on it, and NOTHING else — git lives
          # under Program Files on Windows, so "/usr/bin:/bin" alone cannot even
          # launch git, let alone the hook.
          MIN_PATH="$(dirname "$(command -v git)"):/usr/bin:/bin"

          # The test is only worth anything if the binary is unreachable by the
          # LAST fallback. If PATH can still find it, fallback 4 answers and the
          # .exe branch this step exists for is never taken.
          if PATH="$MIN_PATH" command -v amont > /dev/null 2>&1; then
            echo "::error::amont is still on the reduced PATH — test proves nothing"
            exit 1
          fi

          echo "hello" > a.txt && git add a.txt
          out=$(PATH="$MIN_PATH" git commit -m "feat: unbaked shim resolves" 2>&1) \
            || { echo "$out"; echo "::error::unbaked shim could not find the binary"; exit 1; }
          echo "$out"
          case "$out" in
            *"amont binary not found"*)
              echo "::error::shim fell through every fallback"; exit 1 ;;
          esac
          git rev-parse --verify HEAD > /dev/null 2>&1 \
            || { echo "::error::commit did not happen"; exit 1; }
          echo "windows unbaked-shim OK"

  test:
    name: hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # WHAT IS INSTALLED HERE, AND WHY EACH ONE.
      #
      # The rule the steps below follow: if a test case is gated on a tool, this
      # job installs it, and the reporter at the bottom FAILS if it turns out
      # not to be there. The one exception is argo, which has a step of its own
      # explaining why it must be absent.
      #
      # Three things this job used to install and no longer needs, kept written
      # down because "why is that gone" is the question that reintroduces them:
      #
      #   zsh — the runner and every test were zsh scripts. The hooks became sh
      #         shims over one binary and the suites became cargo integration
      #         tests; nothing here is zsh any more.
      #   fd  — `pre-push-run-tests-js` shelled out to `fd package.json`.
      #   rg  — the shell hooks matched with ripgrep.
      #
      # fd and rg were undeclared HARD dependencies whose absence produced
      # silent wrong answers rather than errors — a hook that found no packages
      # and reported success. The Rust ports use `git ls-files` and native
      # matching, so the guard added for that (#13) retired with the shell it
      # protected.
      - name: Install ruff (macOS)
        if: runner.os == 'macOS'
        run: brew install ruff

      - name: Install ruff (Linux)
        if: runner.os == 'Linux'
        run: pipx install ruff

      # `uv` — and the ruff above is KEPT, not replaced.
      #
      # Three cases in linters.rs gate on `missing("ruff") && missing("uvx")`,
      # so before this step they ran only because ruff was installed; `uvx` was
      # never on the runner at all. Installing uv covers the other half of that
      # gate.
      #
      # It also CHANGES WHICH BRANCH those cases exercise, and that is worth
      # knowing rather than discovering. `python_tools::resolve_python_tool`
      # tries `uv run --no-sync <tool>` FIRST — the lockfile-pinned tool a
      # project's CI would use. The fixtures write a `pyproject.toml` containing
      # only `[tool.ruff]` and no `[project]` table, so `uv run` finds no
      # project, `tool_runs` sees a non-zero `--version`, and resolution falls
      # through to the PATH ruff. So the assertions still measure ruff's
      # verdict, but they now measure it having traversed the uv branch and
      # rejected it — which is the first branch of that function and was
      # previously never taken here at all.
      - name: Install uv (macOS)
        if: runner.os == 'macOS'
        run: brew install uv

      - name: Install uv (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          # The installer writes ~/.local/bin and edits shell rc files, which a
          # non-interactive `run:` step never sources. $GITHUB_PATH is how a
          # later step in the same job sees it.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # yamllint — two cases in linters.rs were gated on it and neither had ever
      # run in CI. Both assert real yamllint behaviour (a trailing-space finding
      # blocks; a `-weird.yaml` filename is still content-checked rather than
      # eaten by argparse), so they were pure decoration until now.
      - name: Install yamllint (macOS)
        if: runner.os == 'macOS'
        run: brew install yamllint

      - name: Install yamllint (Linux)
        if: runner.os == 'Linux'
        run: pipx install yamllint

      # hadolint — the new `pre-commit-hadolint` cases would otherwise be
      # decoration, and the reporter at the bottom of this job FAILS rather
      # than let them skip quietly. That guard is what caught this.
      #
      # Pinned rather than `latest`, for the reason spelled out under yq: a
      # floating tag makes this job's behaviour change without a commit. There
      # is no apt package, so Linux takes the release binary directly.
      - name: Install hadolint (macOS)
        if: runner.os == 'macOS'
        run: brew install hadolint

      - name: Install hadolint (Linux)
        if: runner.os == 'Linux'
        env:
          HADOLINT_VERSION: v2.12.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)        arch=x86_64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::no hadolint build mapped for $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-${arch}"
          curl -fsSL --retry 3 -o /tmp/hadolint "$url"
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
          hadolint --version

      # yq — and it MUST be mikefarah/yq.
      #
      # There are two unrelated programs called `yq`. The PyPI one (kislyuk/yq)
      # is a jq wrapper with a different CLI; mikefarah/yq is the Go one. The
      # hook runs `yq e 'true' -- <file>`, which is mikefarah syntax — `e`
      # (eval) is not a kislyuk subcommand and the `--` separator, which exists
      # here so a staged `-weird.yaml` is not read as a flag, is parsed
      # differently. Installing the wrong one would make six cases in
      # linters.rs fail in a way that looks like a hook bug.
      #
      # So: Homebrew's `yq` formula IS mikefarah's, and on Linux the release
      # binary is fetched directly at a PINNED tag rather than through a distro
      # package (Ubuntu's `yq` is the Python one) or `latest` (which would make
      # this job's behaviour change without a commit).
      - name: Install yq — mikefarah/yq (macOS)
        if: runner.os == 'macOS'
        run: brew install yq

      - name: Install yq — mikefarah/yq (Linux)
        if: runner.os == 'Linux'
        env:
          YQ_VERSION: v4.44.6
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)          arch=amd64 ;;
            aarch64|arm64)   arch=arm64 ;;
            *) echo "::error::no yq build mapped for $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${arch}"
          curl -fsSL --retry 3 -o /tmp/yq "$url"
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          # Prove it is the RIGHT yq before any test depends on it. The version
          # banner names the repository, so this cannot be satisfied by the
          # PyPI package having been picked up from somewhere else on PATH.
          yq --version
          yq --version | grep -q 'mikefarah/yq' \
            || { echo "::error::PATH yq is not mikefarah/yq"; exit 1; }
          printf 'a: 1\n' > /tmp/yqprobe.yaml
          yq e 'true' -- /tmp/yqprobe.yaml > /dev/null \
            || { echo "::error::yq does not accept the syntax the hook uses"; exit 1; }

      # argo is NOT installed, and that is the whole point.
      #
      # The only argo-gated case in the suite is `argo_soft_fails_without_the_
      # cli`, and it opens with `if !missing("argo") { return; }` — it tests the
      # ABSENT branch, asserting that a missing toolchain warns and lets the
      # commit through. Installing argo would silently DISABLE the one test that
      # mentions it, which is the exact inversion of every other tool gate here.
      #
      # And the skip reporter below could not have told you: the early return
      # prints nothing, so the log would read as though the case ran. The test
      # now prints a marker of its own on that return (see k8s.rs), and this
      # step asserts the precondition that makes it meaningful.
      - name: argo must be ABSENT (the only argo test needs it missing)
        run: |
          if command -v argo > /dev/null 2>&1; then
            echo "::error::argo is on PATH — argo_soft_fails_without_the_cli now returns early and asserts nothing"
            exit 1
          fi
          echo "argo absent, as the test requires"

      # Fail here, with a name, rather than 14 suites down as an opaque
      # assertion failure — the hooks' hard dependencies are undeclared
      # anywhere else in the repo.
      - name: Hard dependencies are present
        run: |
          rc=0
          for bin in git node npm cargo; do
            if command -v "$bin" > /dev/null; then
              printf '  ok   %-5s %s\n' "$bin" "$(command -v "$bin")"
            else
              printf '  MISS %-5s\n' "$bin"; rc=1
            fi
          done
          exit $rc

      # The tool-dependent tests (lint-js, prettier, ruff, pyright) skip
      # gracefully when their binary is missing — which would leave CI green
      # while silently testing far less. Install them so those suites actually
      # assert something. Resolution order in the hooks ends at PATH, so a
      # global install is enough.
      #
      # pyright has been installed here since this step was written, and until
      # now NOTHING gated on it: `pre-commit-pyright` is a `Severity::Block`
      # check — it stops commits — whose only test asserted that it does nothing
      # in a repo with no config. The tool was present and unexercised, which is
      # the more expensive half of the same mistake as a tool that is absent and
      # silently skipped. linters.rs now has the two cases that need it.
      - name: Install the tools the hooks drive
        run: npm i -g eslint prettier pyright

      # kube-linter and kubeconform are Severity::Block checks that had never
      # RUN their tool in any test environment: every k8s case asserted
      # scoping or the not-opted-in silence, so the two checks that stop
      # commits had never stopped or passed one — pyright's mistake (above),
      # one tool over. kustomize rides along because the kubeconform check
      # requires both. Versions pinned: an upstream release must not be able
      # to change what this suite asserts.
      - name: Install the k8s tools (macOS)
        if: runner.os == 'macOS'
        run: brew install kube-linter kubeconform kustomize

      - name: Install the k8s tools (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/stackrox/kube-linter/releases/download/v0.7.2/kube-linter-linux.tar.gz \
            | tar xz -C "$HOME/.local/bin" kube-linter
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C "$HOME/.local/bin" kubeconform
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" kustomize
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Every test does real commits in a throwaway repo. Only two set a local
      # identity, so without a global one the rest fail at `git commit` with
      # "Please tell me who you are" — and the failure would look like a hook
      # bug rather than a missing CI setting.
      - name: Git identity for the throwaway test repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "git-templates ci"
          git config --global init.defaultBranch main

      # tee, not a second run: the skip check below reads this output rather
      # than paying for the whole suite twice. Depends on the workflow-level
      # `shell: bash` above for pipefail — see the comment there.
      - name: make test
        run: make test 2>&1 | tee /tmp/hooks-test.log

      # A skip is legitimate (a tool genuinely absent) but must not pass
      # unnoticed: the whole point of installing the tools above is that these
      # suites run for real. A green tick over a suite that quietly skipped is
      # the failure mode worth surfacing.
      #
      # Match the tests' actual skip marker, not the bare word: one test is
      # NAMED "Should stop at the first failure, skipping the rest of the gate",
      # so `grep skipping` warned on a perfectly healthy run. A warning that
      # cries wolf is one people learn to scroll past.
      #
      # THIS STEP NOW FAILS. It used to emit `::warning::` and exit 0, which
      # means the condition it exists to detect never once turned a run red —
      # and an annotation on an otherwise-green run is precisely the thing
      # people scroll past. That is how eight cases (four yq, two yamllint, and
      # the uvx half of the ruff gate) stayed unexecuted across every run of
      # this workflow while the job reported success.
      #
      # The rule is an ALLOWLIST, not a blanket ban, because one skip is
      # correct: see the `argo` step above. Anything else means a tool this job
      # installs did not end up on PATH, or a new gate was added without an
      # install beside it — both of which are bugs in this file, and both of
      # which should stop the run rather than decorate it.
      #
      # `if: always()` and the full list is still printed on success, so the
      # allowlist stays reviewable instead of becoming a rule nobody can see the
      # effect of.
      - name: Report skipped suites
        if: always()
        run: |
          set -uo pipefail

          # Tools this platform may legitimately lack, with the reason, because
          # an allowlist without reasons grows silently.
          #
          #   argo — deliberately NOT installed. The only argo-gated case is
          #          `argo_soft_fails_without_the_cli`, which asserts the
          #          SOFT-FAIL branch: a missing toolchain must warn and let the
          #          commit through. It therefore needs argo absent, and this
          #          marker means the opposite of what it means for every other
          #          tool in the list — the case RAN, and ran because the tool
          #          is missing. `missing()` prints "unavailable — skipping"
          #          unconditionally; only the second half is wrong here.
          allowed="argo"

          if [ ! -f /tmp/hooks-test.log ]; then
            echo "::error::/tmp/hooks-test.log is missing — the test step did not get far enough to produce one"
            exit 1
          fi

          # `missing()` in crates/amont/tests/common/mod.rs prints exactly
          # `  ! <tool> unavailable — skipping`. Pull the tool name out of that.
          skipped=$(grep -o '! [A-Za-z0-9_.+-]* unavailable — skipping' /tmp/hooks-test.log \
                    | awk '{print $2}' | sort -u || true)

          echo "--- tools skipped in this run ---"
          if [ -z "$skipped" ]; then
            echo "  (none)"
          else
            printf '%s\n' "$skipped" | sed 's/^/  /'
          fi
          echo "--- allowed to be absent on ${{ runner.os }} ---"
          printf '%s\n' "$allowed" | sed 's/^/  /'

          rc=0
          for tool in $skipped; do
            case " $allowed " in
              *" $tool "*) ;;
              *)
                echo "::error::$tool was unavailable, so its cases did not run. Install it in this job, or add it to the allowlist above with a reason."
                rc=1
                ;;
            esac
          done

          # The other direction, and the one that bit: a case can skip WITHOUT
          # printing `missing()`'s marker if it returns early for its own
          # reasons. `argo_soft_fails_without_the_cli` is exactly that, so it
          # prints a marker of its own and this asserts the marker is there.
          # Without this, "argo is allowlisted" would be indistinguishable from
          # "the argo case vanished".
          if ! grep -q 'argo PRESENT — skipping' /tmp/hooks-test.log \
             && ! printf '%s\n' "$skipped" | grep -qx argo; then
            echo "::error::neither argo marker appeared — the argo soft-fail case no longer reports whether it ran"
            rc=1
          fi

          exit $rc
