name: Release

# Cutting a release means: a tag, prebuilt binaries for every platform the hooks
# claim to support, and checksums. Until this existed the only install path was
# `git clone` into a specific config directory — a 2015 install story for a Rust
# binary, and the reason `curl | sh` and `brew install` were impossible.
#
# Triggered by the TAG, never by a branch push. The tag is the decision.

on:
  push:
    tags: ["v*"]
  # So a release can be rehearsed end to end without publishing one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run — no release is published)"
        required: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # The tag and the manifest must agree BEFORE anything is built.
  #
  # This is the footgun that motivated the whole job: a commit-msg hook rejects
  # a commit, the shell carries on to `git tag`, and the tag lands on the OLD
  # head — so CI builds and publishes the new version number from stale code.
  # Registries are immutable; the wrong bytes under a version cannot be
  # replaced, only superseded. Checking costs four lines and runs first.
  guard:
    name: the tag says what the manifest says
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            dry=false
          else
            tag="${{ inputs.tag }}"
            tag="${tag#v}"
            [ -n "$tag" ] || tag="$manifest"
            dry=true
          fi
          echo "manifest=$manifest tag=$tag dry_run=$dry"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag v$tag does not match [workspace.package] version $manifest."
            echo "::error::Commit the version bump FIRST, confirm HEAD moved, then tag."
            exit 1
          fi
          # The manifest grh pins says the same version (grh's "Shipping a
          # manifest"): a released greenharness.toml naming another version
          # is one grh refuses, and a released asset is never replaced.
          gh_manifest=$(python3 -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["extension"]["version"])' greenharness.toml)
          if [ "$gh_manifest" != "$tag" ]; then
            echo "::error::greenharness.toml [extension] version $gh_manifest does not match tag v$tag."
            exit 1
          fi
          # The same bargain as the version check: the release notes lead
          # with CHANGELOG.md's section for this version, so a missing
          # section would publish a release that opens with nothing. Refuse
          # now, while writing it costs one commit instead of a re-release.
          if ! awk -v ver="v$manifest" '$1 == "##" && $2 == ver { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v$manifest' section."
            echo "::error::Write what the upgrader gets, then tag."
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One broken target must not hide the others: a partial release is
      # something to see in full, not to discover one platform at a time.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Static, so it runs on distros older than the runner's glibc — the
          # usual reason a "linux" binary fails for somebody.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain for ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}
      - name: Install cross-compilation packages
        if: matrix.packages != ''
        # The Azure apt mirror hung `apt-get update` for the full 30-minute
        # job budget — three release attempts in a row (v1.7.0, 2026-08-19),
        # each stalling after `noble-security InRelease` with the build never
        # reached. Three defences, each sufficient alone: the canonical
        # archive instead of the Azure mirror, a per-fetch timeout with
        # retries, and a step budget so a hang costs five minutes and a
        # cheap `gh run rerun --failed`, not the release.
        timeout-minutes: 5
        run: |
          # The runner routes apt through `mirror+file:/etc/apt/apt-mirrors.txt`,
          # so rewriting the sources files alone still let every fetch start at
          # the Azure mirror — the v1.7.3 logs show `Ign:` lines against
          # azure.archive after the sed had already run. Rewrite the mirror
          # LIST, which is the knob the image actually reads.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 install -y ${{ matrix.packages }}
      - name: Point cargo at the cross linker
        if: matrix.linker != ''
        run: |
          target_upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${target_upper}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      # Both binaries: `greengate` is the hook runtime and the only one
      # anybody strictly needs; `greengate-fleet` is the opt-in dashboard, and
      # shipping it here is what stops it being a build-from-source-only
      # feature.
      #
      # `amont-agent` used to be a third. It is its own project now —
      # github.com/greenharness/greenpiste — with its own release.
      - run: cargo build --release --target ${{ matrix.target }} --bin greengate --bin greengate-fleet

      - name: Archive
        id: archive
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          exe=
          if [ "${{ runner.os }}" = "Windows" ]; then exe=.exe; fi
          rel="target/${{ matrix.target }}/release"
          # Two archives from the same build. `greengate-<v>-<t>` holds
          # greengate and greengate-fleet. `amont-<v>-<t>` holds the same
          # bytes under the old names, from an `amont-<v>-<t>/` directory of
          # REGULAR files, because 2.x install.sh/install.ps1 and CI images
          # (the homelab runner extracts the member `amont-<v>-<t>/amont`)
          # build that name from releases/latest. Shipped on every release
          # until the step-5 census finds no 2.x consumer (plan "amont ships
          # as greengate").
          for pair in greengate:greengate-fleet amont:amont-fleet; do
            hook=${pair%%:*}
            fleet=${pair#*:}
            name="${hook}-${version}-${{ matrix.target }}"
            staging="dist/$name"
            mkdir -p "$staging"
            # The shims travel WITH the binary. A release that shipped only
            # the executable would leave `init.templateDir` users with nothing
            # to point git at, which is half the product.
            cp -r templates "$staging/"
            cp README.md LICENSE "$staging/"
            cp "$rel/greengate$exe" "$staging/$hook$exe"
            cp "$rel/greengate-fleet$exe" "$staging/$fleet$exe"
            if [ -n "$exe" ]; then
              (cd dist && 7z a "$name.zip" "$name" > /dev/null)
            else
              (cd dist && tar czf "$name.tar.gz" "$name")
            fi
          done
          # Uploaded as one artifact per target; the archives only, never
          # the staging directories.
          echo "assets<<EOF" >> "$GITHUB_OUTPUT"
          ls dist/*.tar.gz dist/*.zip 2>/dev/null >> "$GITHUB_OUTPUT" || true
          echo "EOF" >> "$GITHUB_OUTPUT"

      # Prove the thing we are about to hand people actually runs. A release
      # asset that cannot execute is the one defect no amount of `cargo test`
      # catches, because tests never touch the packaged artifact.
      - name: The packaged binary runs
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          bin="dist/greengate-${version}-${{ matrix.target }}/greengate"
          # An `if`, not `[ … ] && …`: under `set -e` a false test as the last
          # command of a line is a FAILING step, so the short form would abort
          # every non-Windows target here.
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" --help | grep -q 'agents-md'
          "$bin" list --json > /dev/null || true
          # Every shipped binary, not just the first one: a packaged asset that
          # cannot execute is the defect `cargo test` structurally cannot see,
          # and it used to be checked for exactly one of them.
          for extra in greengate-fleet; do
            side="dist/greengate-${version}-${{ matrix.target }}/$extra"
            if [ "${{ runner.os }}" = "Windows" ]; then side="$side.exe"; fi
            [ -x "$side" ] || { echo "::error::$extra is missing or not executable"; exit 1; }
            "$side" --help > /dev/null || { echo "::error::$extra does not answer --help"; exit 1; }
          done
          # The old-name archive runs too, and answers as the new build.
          for old in amont amont-fleet; do
            side="dist/amont-${version}-${{ matrix.target }}/$old"
            if [ "${{ runner.os }}" = "Windows" ]; then side="$side.exe"; fi
            [ -f "$side" ] && [ ! -L "$side" ] || { echo "::error::$old is missing or a link in the old-name archive"; exit 1; }
            "$side" --version | grep -q "$version" || { echo "::error::$old does not answer --version $version"; exit 1; }
          done
          echo "every packaged binary answers --help"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.archive.outputs.assets }}
          if-no-files-found: error

  # The blocking twin of ci.yaml's advisory audit — same parsing, opposite
  # stakes. On a PR an advisory is information; on a TAG it is about to be
  # compiled into six binaries and served to installers, so:
  #
  #   - a VULNERABILITY fails the release (the advisory ids decide, exactly
  #     as in ci.yaml — the exit code alone conflates findings with fetch
  #     failures);
  #   - warning-class advisories (unmaintained/unsound) stay named
  #     annotations: the tree carries two today in the fleet's TUI stack,
  #     and a gate nothing can pass is a gate people learn to delete;
  #   - a fetch failure ALSO fails, unlike ci.yaml: "could not check" is not
  #     "clean", and an unchecked tree does not ship. On a PR you retry
  #     tomorrow; a release published today is immutable today.
  audit:
    name: no known vulnerabilities ship
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}
      - name: Install cargo-audit
        run: command -v cargo-audit > /dev/null || cargo install --locked cargo-audit
      - name: Audit the resolved tree
        run: |
          set -uo pipefail
          # The runner's shell already carries -e, and every branch below was
          # unreachable because of it. Two aborts, both before any of this
          # script's own reporting could run:
          #
          #   * a CLEAN tree — `grep` finds no RUSTSEC id, exits 1, pipefail
          #     propagates, -e kills the script. The gate failed precisely
          #     when there was nothing wrong, and said nothing. v1.33.0 hit
          #     exactly this.
          #   * a VULNERABLE tree — `cargo audit` exits non-zero, the pipeline
          #     fails, -e kills the script at that line. The right outcome,
          #     reached for the wrong reason, with the ids never named.
          #
          # `if` suspends -e for its condition, so a non-zero audit becomes a
          # value here instead of an abort; with pipefail, $? is the
          # pipeline's first failure. An empty `ids` is the good case, not an
          # error, so the grep may fail.
          if cargo audit --color never 2>&1 | tee /tmp/audit.log; then
            rc=0
          else
            rc=$?
          fi
          ids=$(grep -Eo 'RUSTSEC-[0-9]{4}-[0-9]{4}' /tmp/audit.log | sort -u) || ids=""

          if [ -z "$ids" ]; then
            if [ "$rc" -eq 0 ]; then
              echo "no advisories against the locked tree"
              exit 0
            fi
            echo "::error::cargo audit could not complete — the tree was NOT checked, and an unchecked tree does not ship"
            exit 1
          fi

          if [ "$rc" -eq 0 ]; then
            echo "::warning::advisories against the locked tree (warnings — unmaintained/unsound); named below, not blocking"
            printf '%s\n' "$ids" | while read -r id; do
              echo "::warning::$id  https://rustsec.org/advisories/$id"
            done
            exit 0
          fi

          echo "::error::VULNERABILITIES against the locked tree — refusing to release"
          printf '%s\n' "$ids" | while read -r id; do
            echo "::error::$id  https://rustsec.org/advisories/$id"
          done
          exit 1

  # Nothing is published until every platform is proven for this exact tree.
  # A pull request proves Linux only; the push to main proves macOS, Windows
  # and the load scenarios and signs them (decisions plan
  # 2026-10-17-amont-ci-proves-platforms-once). The release PR's merge starts
  # that CI while this tag is already building, so this waits for its
  # signatures, up to 45 minutes, and refuses with the list of what is
  # missing. The builds run meanwhile; only publishing waits.
  proven:
    name: every platform is proven for this tree
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      # attest's verifier at the version and archive digest its own RELEASE
      # pins for v1.7.0.
      - name: git-attest 1.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=git-attest-1.7.0-x86_64-unknown-linux-musl
          # Through the API, not the web route, which throttles anonymous downloads (504s on 2026-11-08).
          for attempt in 1 2 3; do
            rc=0
            timeout 120 gh release download "v1.7.0" --repo fredericrous/attest \
              --pattern "$name.tar.gz" -O "$RUNNER_TEMP/$name.tar.gz" --clobber || rc=$?
            [ "$rc" = 0 ] && break
            if [ "$attempt" = 3 ]; then
              echo "::error::could not download $name.tar.gz from fredericrous/attest v1.7.0 (exit $rc; 124 = timed out after 120 s)"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "6d25cc5320670d7f2bf225bd9a653b5b862be015e17b678e642bedb2e23ba2db  $RUNNER_TEMP/$name.tar.gz" \
            | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "GIT_ATTEST=$RUNNER_TEMP/$name/git-attest" >> "$GITHUB_ENV"
      # A dry run asks once: it rehearses, it does not wait for CI.
      - run: ./scripts/ci-release-gates.sh --wait ${{ needs.guard.outputs.dry_run == 'true' && '0' || '2700' }}

  # greengate stands alone (ADR-0064 `harness.standalone-tools`): installed
  # from its own archive on a clean runner with no grh, it answers --help,
  # reads a real repository, and its old name runs as the same build.
  standalone:
    name: greengate stands alone
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - name: Install the archive and run it with no grh
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          if command -v grh > /dev/null 2>&1; then
            echo "::error::grh is on this runner; the check would prove nothing"; exit 1
          fi
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          tar xzf "dist/greengate-${version}-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP"
          src="$RUNNER_TEMP/greengate-${version}-x86_64-unknown-linux-gnu"
          cp "$src/greengate" "$src/greengate-fleet" "$bin/"
          cp "$src/greengate" "$bin/amont"
          export PATH="$bin:$PATH"
          greengate --help | grep -q 'agents-md'
          repo="$RUNNER_TEMP/repo"
          git init -q --template= "$repo"
          (cd "$repo" && greengate list --json) > "$RUNNER_TEMP/list.json"
          python3 -I -c 'import json, sys; json.load(open(sys.argv[1]))' "$RUNNER_TEMP/list.json"
          amont --version | tee "$RUNNER_TEMP/v"
          grep -qx "greengate $version" "$RUNNER_TEMP/v"
          # And the old-name archive a 2.x installer fetches holds a runnable
          # `amont-<v>-<t>/amont` at that exact member path.
          tar tzf "dist/amont-${version}-x86_64-unknown-linux-gnu.tar.gz" > "$RUNNER_TEMP/members"
          grep -qx "amont-${version}-x86_64-unknown-linux-gnu/amont" "$RUNNER_TEMP/members"
          echo "greengate installs, runs and answers to amont with no grh"

  publish:
    name: publish the release
    needs: [guard, build, audit, proven, standalone]
    runs-on: ubuntu-latest
    # `id-token: write` is the OIDC grant `attest-build-provenance` signs
    # with — the same one `publish-npm` already holds for `--provenance`.
    # `attestations: write` lets it store the result against this repo.
    # No key is held anywhere: trust binds to this workflow at this tag.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The manifest grh pins, written from the tarballs BEFORE SHA256SUMS so
      # it is checksummed and attested with them (grh's "Shipping a
      # manifest"). Its [tool.release] names the greengate-* tarballs only.
      - name: The manifest grh pins
        run: |
          set -euo pipefail
          python3 -I scripts/release-manifest.py "${{ needs.guard.outputs.version }}" \
            dist greenharness.toml dist/greenharness.toml
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # Attest AFTER the checksums are written, so `SHA256SUMS` is itself a
      # subject. That is the point: the installer and the tap already verify
      # against that file, and until now it was served from the same origin
      # as the artifacts it vouched for — a checksum authenticates nothing
      # against a compromise of the place it came from. Anchoring the file
      # anchors every consumer downstream of it without changing one.
      #
      # Attestations go to GitHub's API, not into `dist`, so the `dist/*`
      # release glob below needs no change. Verify with:
      #   gh attestation verify <file> --repo greenharness/greengate
      - name: Attest
        if: needs.guard.outputs.dry_run == 'false'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      # A dry run stops here, having built and checksummed everything. The only
      # step it skips is the irreversible one.
      - name: Publish
        if: needs.guard.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent, because re-running a release is a normal thing to want.
          # `gh release create` fails outright on "a release with the same tag
          # name already exists", which took down the whole run — and with it
          # `publish-crates`, which needs this job. That is precisely backwards:
          # the reason to re-run is usually that a LATER step failed.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            # A released asset is never replaced (no --clobber): grh pins the
            # manifest's digest, and an installer that checked an archive
            # once must find the same bytes again. Upload what is missing;
            # an asset already there must carry the digest this run's
            # SHA256SUMS names, or the run fails, because a different digest
            # means this build is not the one that was published.
            echo "release ${GITHUB_REF_NAME} already exists — uploading only what is missing"
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
              --jq '.assets[] | .name + " " + (.digest // "")' > /tmp/published
            for f in dist/*; do
              name=$(basename "$f")
              line=$(awk -v n="$name" '$1 == n { print $2 }' /tmp/published)
              if [ -z "$(awk -v n="$name" '$1 == n' /tmp/published)" ]; then
                echo "uploading $name"
                gh release upload "${GITHUB_REF_NAME}" "$f"
                continue
              fi
              want="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
              if [ "$name" = SHA256SUMS ]; then
                # The published SHA256SUMS must list the same digests.
                gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS --output /tmp/published-sums --clobber
                cmp -s /tmp/published-sums "$f" || { echo "::error::the published SHA256SUMS differs from this build's"; exit 1; }
              elif [ -n "$line" ] && [ "$line" != "$want" ]; then
                echo "::error::$name on the release is $line, this build made $want; a released asset is never replaced"
                exit 1
              fi
              echo "$name is already published with this build's digest"
            done
          else
            # Notes an upgrader can read, then the generated PR list. Bare
            # --generate-notes published this repository's PR titles as the
            # whole story, and they are written for the history, not for
            # somebody deciding whether to upgrade. The guard job already
            # proved the CHANGELOG section exists. Matching on $2 rather
            # than a prefix so extracting v1.0.2 can never grab v1.0.21.
            notes=$(mktemp)
            awk -v ver="${GITHUB_REF_NAME}" '
              $1 == "##" && $2 == ver { grab = 1; next }
              $1 == "##" && grab      { exit }
              grab                    { print }
            ' CHANGELOG.md > "$notes"
            printf '\n---\n\n' >> "$notes"
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" --jq .body >> "$notes"
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$notes" \
              dist/*
          fi
      - name: Dry run summary
        if: needs.guard.outputs.dry_run == 'true'
        run: |
          echo "### Dry run — nothing published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # crates.io, so `cargo install greengate` works.
  #
  # Here rather than from a laptop for the usual reason a release belongs in CI:
  # the bytes published should come from a checkout of the tag, built by
  # something reproducible, with the credential held by the repository rather
  # than sitting in somebody's `~/.cargo/credentials.toml`.
  #
  # `needs: build` on purpose. If a target does not compile, that is a release
  # nobody should be able to `cargo install` either — and crates.io versions are
  # npm, so `npm install -D @greenharness/greengate` + `"prepare": "greengate init"`
  # works — the
  # husky-shaped adoption path.
  #
  # Seven packages: six per-platform ones carrying the SAME binaries this release
  # already published and checksummed, and `@greenharness/greengate` itself, a JS shim and
  # six `optionalDependencies`. No `postinstall` anywhere, so this survives
  # `npm ci --ignore-scripts`, an offline cache and a pull-through registry —
  # see npm/README.md for why that ruled out the download-on-install shape.
  publish-npm:
    name: publish to npm
    needs: [guard, build, publish]
    # Keyed on the ref being a TAG rather than on dry_run, exactly as
    # publish-crates is, so a workflow_dispatch against an existing tag can
    # resume a publish that failed for a reason outside this repository.
    #
    # HELD until each new package exists on npm. 3.0.0 publishes
    # `@greenharness/greengate` and six `@greenharness/greengate-<target>`
    # packages; npm's trusted publishing cannot create a package, so the
    # person publishes each once (a one-time granular token, or npm's pending
    # publisher), names this workflow as its trusted publisher, and sets the
    # repository variable NPM_GREENGATE_PUBLISHED=true. Until then this job
    # is skipped, and `gh workflow run release.yaml --ref v<version>` resumes
    # it afterwards. npm's `amont` stays at 2.3.0, deprecated towards the
    # new package (plan "amont ships as greengate").
    if: github.ref_type == 'tag' && vars.NPM_GREENGATE_PUBLISHED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `contents: read` narrows the workflow-level `write` — this job publishes
    # nothing to the repository. `id-token: write` is the whole credential:
    # npm's trusted publishing trades this workflow's OIDC token for a
    # short-lived publish token, and `--provenance` signs with the same grant.
    # There is no NPM_TOKEN. The long-lived one expired on 2026-11-08 (npm caps
    # write tokens at 90 days) and failed v2.3.1's publish. Each package names
    # greenharness/greengate's `release.yaml` as its trusted publisher on
    # npmjs.com; a package that does not is refused with a 403 or 404.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No `registry-url`: it writes an .npmrc that reads NODE_AUTH_TOKEN and
      # fills it with a placeholder, a stray credential beside the OIDC one.
      # npm's default registry is registry.npmjs.org already.
      # Trusted publishing needs npm 11.5.1 or later; node 22 ships npm 10.
      - run: npm install -g npm@11.6.2 && npm --version
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Lays out the trees and then REFUSES to hand back a set that would not
      # install: a missing binary, a package.json that is not JSON, or an
      # optionalDependency naming a version nothing built. npm versions are
      # immutable, so every one of those can only be superseded afterwards.
      - name: Lay out the packages
        run: ./scripts/npm-pack.sh "${{ needs.guard.outputs.version }}" dist dist/npm

      # Pack before publish, and assert the binary is IN the tarball. `files`
      # narrows what ships, and a package whose payload was excluded still
      # publishes cleanly — it fails later, on somebody's machine, at their first
      # commit.
      - name: The tarball actually carries the binary
        run: |
          set -euo pipefail
          cd dist/npm/@greenharness/greengate-linux-x64-gnu
          # Listed to a file, THEN grepped — never `tar … | grep -q`. `grep -q`
          # exits at the first match and closes the pipe, tar takes EPIPE, and
          # under `pipefail` that is a failed step reported as
          # `tar: stdout: write error`. BSD tar tolerates it, GNU tar does not,
          # so it passed on macOS locally and failed the release on ubuntu.
          npm pack --silent > /tmp/packed
          tar tzf "$(cat /tmp/packed)" > /tmp/contents
          grep -qx 'package/bin/greengate' /tmp/contents
          echo "the linux-x64-gnu tarball carries bin/greengate"

          # And the ROOT package, which is the one people install. Checking a
          # platform package alone is what let a broken root ship for four
          # releases: the wrapper requires `./native.js`, the packer staged
          # only the first, and the result installed cleanly and died on
          # first use with MODULE_NOT_FOUND.
          cd "$GITHUB_WORKSPACE/dist/npm/@greenharness/greengate"
          npm pack --silent > /tmp/packed-root
          tar tzf "$(cat /tmp/packed-root)" > /tmp/root-contents
          for f in package/bin/greengate.js package/bin/native.js; do
            grep -qx "$f" /tmp/root-contents || {
              echo "::error::the @greenharness/greengate tarball is missing $f"
              echo "::error::it carries:"; sed 's/^/::error::  /' /tmp/root-contents
              exit 1; }
          done
          echo "the @greenharness/greengate tarball carries both wrappers"

      - name: Publish platform packages, then @greenharness/greengate
        run: |
          set -euo pipefail

          # ORDER IS LOAD-BEARING. The root declares each platform package at this
          # exact version, and npm validates that a dependency version exists at
          # publish time — so publishing the root first fails the whole job, and
          # publishing it first SUCCESSFULLY would be worse: an immutable version
          # nobody can install.
          #
          # Idempotent on "already published" for the same reason publish-crates
          # is: the usual reason to re-run a release is that a LATER step failed.
          publish() {
            local dir="$1"
            echo "→ publishing $(basename "$dir")"
            if out=$(npm publish --access public --provenance "$dir" 2>&1); then
              printf '%s\n' "$out"
            else
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qiE "cannot publish over|previously published|EPUBLISHCONFLICT"; then
                echo "  already published — continuing"
              elif printf '%s' "$out" | grep -qE "TLOG_CREATE_ENTRY_ERROR|\(409\) an equivalent entry already exists"; then
                # `--provenance` logs the tarball in Sigstore BEFORE the
                # registry is asked, and these tarballs are reproducible: a
                # re-run of a version already up gets Sigstore's 409, never
                # the registry's "previously published" above. Ask the
                # registry which it is (1.61.0 stopped half-published on a
                # 409 from npm's own retry, and every re-run 409'd again).
                local pkg ver
                pkg=$(node -p "require('./$dir/package.json').name")
                ver=$(node -p "require('./$dir/package.json').version")
                if [ "$(npm view "$pkg@$ver" version 2>/dev/null)" = "$ver" ]; then
                  echo "  already published (Sigstore 409) — continuing"
                else
                  echo "::error::$pkg@$ver is NOT on npm, and Sigstore already logs this exact tarball (409)."
                  echo "::error::No re-run can publish it with provenance: the tarball is the same, so the log answer is too."
                  echo "::error::Release the next patch version; its tarballs are new entries."
                  exit 1
                fi
              elif printf '%s' "$out" | grep -qE "E403|E404|ENEEDAUTH"; then
                # With trusted publishing there is no token to check: npm refuses
                # a package whose trusted publisher is not this workflow, and it
                # words that as a 403, a 404 or "need auth" depending on the
                # step that failed. A brand-new package cannot be published this
                # way at all: its first version needs a person's token.
                echo "::error::npm refused $(basename "$dir") (no trusted publisher matches this workflow)."
                echo "::error::On npmjs.com, open the package's Settings, Trusted publisher, GitHub Actions:"
                echo "::error::  organization ${GITHUB_REPOSITORY_OWNER}, repository ${GITHUB_REPOSITORY#*/}, workflow release.yaml, no environment."
                echo "::error::Then re-run without a new tag: gh workflow run release.yaml --ref ${GITHUB_REF_NAME}"
                exit 1
              else
                echo "::error::publishing $(basename "$dir") failed"
                exit 1
              fi
            fi
          }

          # AN EXPLICIT LIST, NOT A GLOB.
          #
          # The platform packages are scoped now, so they lay out under
          # `dist/npm/@greenharness/…` and `dist/npm/greengate-*` matches nothing
          # at all — the loop would silently publish ZERO platform packages
          # and then publish the root against six dependencies that do not
          # exist. npm versions are immutable, so that is a version bump to
          # recover from, not a re-run.
          #
          # Even flat, a glob was the wrong shape: it has to match every
          # platform package and never the root, and nothing enforces that
          # but care. `npm-pack.sh`'s TARGETS table is the source of truth,
          # and `npm_packaging.rs` asserts this list agrees with it.
          for t in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu linux-x64-musl win32-x64; do
            publish "dist/npm/@greenharness/greengate-$t"
          done
          publish dist/npm/@greenharness/greengate

          echo "### Published to npm" >> "$GITHUB_STEP_SUMMARY"
          echo "\`npm i -D @greenharness/greengate\` — v${{ needs.guard.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  # IMMUTABLE, so a bad publish can only be yanked and superseded, never fixed.
  # The binaries are the cheaper thing to get wrong.
  publish-crates:
    name: publish to crates.io
    # `standalone` too: a broken archive must never leave published crates.
    needs: [guard, build, standalone, publish]
    # Keyed on the ref being a TAG, not on dry_run — so a `workflow_dispatch`
    # against an existing tag (`gh workflow run release.yaml --ref v1.0.0`)
    # publishes the crates without re-creating a GitHub release that already
    # exists. That is the resume path when a publish failed for a reason
    # outside this repository, which is exactly how v1.0.0 went: crates.io
    # refuses any upload from an account with no verified email address, and
    # says so with a 400 no amount of CI can fix.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The order, the resume probe and the "already uploaded" tolerance
      # live in scripts/publish-crates.sh, which scripts/test_publish_crates.sh
      # checks with a stubbed registry (CI's `rust` job). Old `amont-*`
      # crates are not republished: their pages keep 2.3.1 (the person's
      # decision, plan "amont ships as greengate").
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set for this environment."
            exit 1
          fi
          sh scripts/publish-crates.sh
          echo "### Published to crates.io" >> "$GITHUB_STEP_SUMMARY"
          echo "\`cargo install greengate\`, then \`greengate install\` for the amont alias — v$VERSION" >> "$GITHUB_STEP_SUMMARY"

  # The release's last manual step, retired. The tap formula was bumped by
  # hand four times in three days — copy a version, copy four sha256 lines,
  # push — and a transcription error there ships a formula brew refuses, or
  # worse, accepts. A release is not published until `brew upgrade` can see
  # it, so the release publishes it.
  #
  # Auth is a deploy key that can write to the TAP REPOSITORY and nothing
  # else (secret TAP_DEPLOY_KEY; the tap holds the matching public key) —
  # narrower than any PAT. The rewrite itself is scripts/bump-tap.py, which
  # asserts on every surprise rather than sedding hopefully, and `ruby -c`
  # proves the result is at least a formula before anything is pushed.
  publish-tap:
    name: publish to the homebrew tap
    needs: [guard, standalone, publish]
    # Keyed on the ref being a TAG exactly as publish-npm is, so a
    # workflow_dispatch against an existing tag can resume this too. The
    # push step's nothing-to-commit path makes that resume a no-op when the
    # tap already carries the version.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # From the PUBLISHED release, not from this run's artifacts: the
      # formula must name the bytes an installer will actually download,
      # and reading them back from the release asserts they are there.
      - name: Download the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --pattern SHA256SUMS

      - name: Clone the tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:fredericrous/homebrew-tap.git tap

      # The formula is greengate's own (packaging/homebrew/greengate.rb),
      # rewritten from the published SHA256SUMS. The rename amont -> greengate
      # goes in the SAME tap commit, written only now that the assets exist:
      # `formula_renames.json` makes `brew upgrade` move an installed amont
      # to greengate, and Formula/amont.rb is removed so the old name cannot
      # be installed beside it.
      - name: Rewrite the formula
        run: |
          set -euo pipefail
          cp packaging/homebrew/greengate.rb tap/Formula/greengate.rb
          python3 -I scripts/bump-tap.py "$VERSION" SHA256SUMS tap/Formula/greengate.rb
          ruby -c tap/Formula/greengate.rb
          python3 -I - tap/formula_renames.json <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          renames = json.loads(path.read_text()) if path.exists() else {}
          renames["amont"] = "greengate"
          path.write_text(json.dumps(renames, indent=2, sort_keys=True) + "\n")
          PY
          rm -f tap/Formula/amont.rb

      - name: Push
        run: |
          set -euo pipefail
          cd tap
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "the tap already carries $VERSION — nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/greengate.rb formula_renames.json
          git add -u Formula
          git commit -m "chore: greengate $VERSION"
          git push origin HEAD
          echo "### Published to the homebrew tap" >> "$GITHUB_STEP_SUMMARY"
          echo "\`brew upgrade fredericrous/tap/greengate\` — v$VERSION (amont renamed to it)" >> "$GITHUB_STEP_SUMMARY"

  # The only thing anywhere that runs the formula.
  #
  # `publish-tap` above proves the file PARSES (`ruby -c`) and that its
  # checksums match the release. Neither is the question a user asks, which
  # is "does `brew install` work" — and the gap between those is not
  # theoretical: this formula carried `bin.install "amont-agent"` for three
  # releases after that binary left the archive in 1.20.0. `bin.install` on a
  # file that is not there aborts the whole formula, so every `brew install`
  # and `brew upgrade` failed outright:
  #
  #     Errno::ENOENT: No such file or directory - amont-agent
  #
  # Every one of those releases was green. The checksums matched, the syntax
  # was valid, and `bump-tap.py` rewrote only the version and the four
  # url/sha pairs (it now also rewrites the homepage), so nothing it touched would ever notice a stale install
  # line. It was found by a human running `brew upgrade` by hand.
  #
  # This job FAILS the run rather than warning. The release is already
  # published by the time it runs and cannot be unpublished, so the point is
  # not to prevent it — it is to make a broken install path impossible to
  # miss. A warning here would reproduce exactly the condition that let this
  # ship: a green release and a broken `brew install`.
  verify-brew:
    name: brew can install what was published
    needs: [guard, publish-tap]
    if: github.ref_type == 'tag'
    # macOS because that is where nearly every brew user of this tool is, and
    # because the bottle-less formula builds from the darwin release asset —
    # the same bytes an actual user downloads.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      # No checkout: this must see only what a stranger sees — the tap and
      # the published release. Anything read out of the repository would be
      # testing the thing we already know.
      - name: Install from the tap
        run: |
          set -euo pipefail
          brew tap fredericrous/tap
          brew install fredericrous/tap/greengate

      - name: The installed binaries are the version just published
        run: |
          set -euo pipefail
          greengate --version | tee /tmp/v
          grep -qx "greengate $VERSION" /tmp/v
          greengate-fleet --version | grep -q "$VERSION"
          # The old names, copies of the same build.
          amont --version | grep -qx "greengate $VERSION"
          amont-fleet --version | grep -q "$VERSION"

      # The formula's own test block, which is the only place the INSTALLED
      # artifact is exercised — and which referenced the departed binary too,
      # so it would have failed for the same reason had anyone run it.
      - name: brew test
        run: brew test fredericrous/tap/greengate

      - name: Say so
        run: |
          echo "### brew install verified" >> "$GITHUB_STEP_SUMMARY"
          echo "\`brew install fredericrous/tap/greengate\` produces v$VERSION" >> "$GITHUB_STEP_SUMMARY"
