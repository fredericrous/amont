name: Release

# Cutting a release means: a tag, prebuilt binaries for every platform the hooks
# claim to support, and checksums. Until this existed the only install path was
# `git clone` into a specific config directory — a 2015 install story for a Rust
# binary, and the reason `curl | sh` and `brew install` were impossible.
#
# Triggered by the TAG, never by a branch push. The tag is the decision.

on:
  push:
    tags: ["v*"]
  # So a release can be rehearsed end to end without publishing one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run — no release is published)"
        required: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # The tag and the manifest must agree BEFORE anything is built.
  #
  # This is the footgun that motivated the whole job: a commit-msg hook rejects
  # a commit, the shell carries on to `git tag`, and the tag lands on the OLD
  # head — so CI builds and publishes the new version number from stale code.
  # Registries are immutable; the wrong bytes under a version cannot be
  # replaced, only superseded. Checking costs four lines and runs first.
  guard:
    name: the tag says what the manifest says
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            dry=false
          else
            tag="${{ inputs.tag }}"
            tag="${tag#v}"
            [ -n "$tag" ] || tag="$manifest"
            dry=true
          fi
          echo "manifest=$manifest tag=$tag dry_run=$dry"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag v$tag does not match [workspace.package] version $manifest."
            echo "::error::Commit the version bump FIRST, confirm HEAD moved, then tag."
            exit 1
          fi
          # The same bargain as the version check: the release notes lead
          # with CHANGELOG.md's section for this version, so a missing
          # section would publish a release that opens with nothing. Refuse
          # now, while writing it costs one commit instead of a re-release.
          if ! awk -v ver="v$manifest" '$1 == "##" && $2 == ver { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v$manifest' section."
            echo "::error::Write what the upgrader gets, then tag."
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One broken target must not hide the others: a partial release is
      # something to see in full, not to discover one platform at a time.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Static, so it runs on distros older than the runner's glibc — the
          # usual reason a "linux" binary fails for somebody.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain for ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}
      - name: Install cross-compilation packages
        if: matrix.packages != ''
        # The Azure apt mirror hung `apt-get update` for the full 30-minute
        # job budget — three release attempts in a row (v1.7.0, 2026-08-19),
        # each stalling after `noble-security InRelease` with the build never
        # reached. Three defences, each sufficient alone: the canonical
        # archive instead of the Azure mirror, a per-fetch timeout with
        # retries, and a step budget so a hang costs five minutes and a
        # cheap `gh run rerun --failed`, not the release.
        timeout-minutes: 5
        run: |
          # The runner routes apt through `mirror+file:/etc/apt/apt-mirrors.txt`,
          # so rewriting the sources files alone still let every fetch start at
          # the Azure mirror — the v1.7.3 logs show `Ign:` lines against
          # azure.archive after the sed had already run. Rewrite the mirror
          # LIST, which is the knob the image actually reads.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 install -y ${{ matrix.packages }}
      - name: Point cargo at the cross linker
        if: matrix.linker != ''
        run: |
          target_upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${target_upper}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      # Both binaries: `amont` is the hook runtime and the only one anybody
      # strictly needs; `amont-fleet` is the opt-in dashboard, and shipping
      # it here is what stops it being a build-from-source-only feature.
      - run: cargo build --release --target ${{ matrix.target }} --bin amont --bin amont-fleet

      - name: Archive
        id: archive
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          name="amont-${version}-${{ matrix.target }}"
          staging="dist/$name"
          mkdir -p "$staging"
          # The shims travel WITH the binary. A release that shipped only the
          # executable would leave `init.templateDir` users with nothing to
          # point git at, which is half the product.
          cp -r templates "$staging/"
          cp README.md LICENSE "$staging/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/amont.exe" "$staging/"
            cp "target/${{ matrix.target }}/release/amont-fleet.exe" "$staging/"
            (cd dist && 7z a "$name.zip" "$name" > /dev/null)
            echo "asset=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/amont" "$staging/"
            cp "target/${{ matrix.target }}/release/amont-fleet" "$staging/"
            (cd dist && tar czf "$name.tar.gz" "$name")
            echo "asset=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      # Prove the thing we are about to hand people actually runs. A release
      # asset that cannot execute is the one defect no amount of `cargo test`
      # catches, because tests never touch the packaged artifact.
      - name: The packaged binary runs
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          bin="dist/amont-${version}-${{ matrix.target }}/amont"
          # An `if`, not `[ … ] && …`: under `set -e` a false test as the last
          # command of a line is a FAILING step, so the short form would abort
          # every non-Windows target here.
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" --help | grep -q 'agents-md'
          "$bin" list --json > /dev/null || true
          echo "the packaged binary answers --help"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.archive.outputs.asset }}
          if-no-files-found: error

  # The blocking twin of ci.yaml's advisory audit — same parsing, opposite
  # stakes. On a PR an advisory is information; on a TAG it is about to be
  # compiled into six binaries and served to installers, so:
  #
  #   - a VULNERABILITY fails the release (the advisory ids decide, exactly
  #     as in ci.yaml — the exit code alone conflates findings with fetch
  #     failures);
  #   - warning-class advisories (unmaintained/unsound) stay named
  #     annotations: the tree carries two today in the fleet's TUI stack,
  #     and a gate nothing can pass is a gate people learn to delete;
  #   - a fetch failure ALSO fails, unlike ci.yaml: "could not check" is not
  #     "clean", and an unchecked tree does not ship. On a PR you retry
  #     tomorrow; a release published today is immutable today.
  audit:
    name: no known vulnerabilities ship
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}
      - name: Install cargo-audit
        run: command -v cargo-audit > /dev/null || cargo install --locked cargo-audit
      - name: Audit the resolved tree
        run: |
          set -uo pipefail
          cargo audit --color never 2>&1 | tee /tmp/audit.log
          rc=${PIPESTATUS[0]}
          ids=$(grep -Eo 'RUSTSEC-[0-9]{4}-[0-9]{4}' /tmp/audit.log | sort -u)

          if [ -z "$ids" ]; then
            if [ "$rc" -eq 0 ]; then
              echo "no advisories against the locked tree"
              exit 0
            fi
            echo "::error::cargo audit could not complete — the tree was NOT checked, and an unchecked tree does not ship"
            exit 1
          fi

          if [ "$rc" -eq 0 ]; then
            echo "::warning::advisories against the locked tree (warnings — unmaintained/unsound); named below, not blocking"
            printf '%s\n' "$ids" | while read -r id; do
              echo "::warning::$id  https://rustsec.org/advisories/$id"
            done
            exit 0
          fi

          echo "::error::VULNERABILITIES against the locked tree — refusing to release"
          printf '%s\n' "$ids" | while read -r id; do
            echo "::error::$id  https://rustsec.org/advisories/$id"
          done
          exit 1

  publish:
    name: publish the release
    needs: [guard, build, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # A dry run stops here, having built and checksummed everything. The only
      # step it skips is the irreversible one.
      - name: Publish
        if: needs.guard.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent, because re-running a release is a normal thing to want.
          # `gh release create` fails outright on "a release with the same tag
          # name already exists", which took down the whole run — and with it
          # `publish-crates`, which needs this job. That is precisely backwards:
          # the reason to re-run is usually that a LATER step failed.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists — refreshing its assets"
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            # Notes an upgrader can read, then the generated PR list. Bare
            # --generate-notes published this repository's PR titles as the
            # whole story, and they are written for the history, not for
            # somebody deciding whether to upgrade. The guard job already
            # proved the CHANGELOG section exists. Matching on $2 rather
            # than a prefix so extracting v1.0.2 can never grab v1.0.21.
            notes=$(mktemp)
            awk -v ver="${GITHUB_REF_NAME}" '
              $1 == "##" && $2 == ver { grab = 1; next }
              $1 == "##" && grab      { exit }
              grab                    { print }
            ' CHANGELOG.md > "$notes"
            printf '\n---\n\n' >> "$notes"
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" --jq .body >> "$notes"
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$notes" \
              dist/*
          fi
      - name: Dry run summary
        if: needs.guard.outputs.dry_run == 'true'
        run: |
          echo "### Dry run — nothing published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # crates.io, so `cargo install amont` works.
  #
  # Here rather than from a laptop for the usual reason a release belongs in CI:
  # the bytes published should come from a checkout of the tag, built by
  # something reproducible, with the credential held by the repository rather
  # than sitting in somebody's `~/.cargo/credentials.toml`.
  #
  # `needs: build` on purpose. If a target does not compile, that is a release
  # nobody should be able to `cargo install` either — and crates.io versions are
  # npm, so `npm install -D amont` + `"prepare": "amont init"` works — the
  # husky-shaped adoption path.
  #
  # Seven packages: six per-platform ones carrying the SAME binaries this release
  # already published and checksummed, and `amont` itself, which is a JS shim and
  # six `optionalDependencies`. No `postinstall` anywhere, so this survives
  # `npm ci --ignore-scripts`, an offline cache and a pull-through registry —
  # see npm/README.md for why that ruled out the download-on-install shape.
  publish-npm:
    name: publish to npm
    needs: [guard, build, publish]
    # Keyed on the ref being a TAG rather than on dry_run, exactly as
    # publish-crates is, so a workflow_dispatch against an existing tag can
    # resume a publish that failed for a reason outside this repository.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `contents: read` narrows the workflow-level `write` — this job publishes
    # nothing to the repository. `id-token: write` is what `npm publish
    # --provenance` signs with, so npm can attest these bytes came from this
    # workflow at this tag rather than from somebody's laptop.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Lays out the trees and then REFUSES to hand back a set that would not
      # install: a missing binary, a package.json that is not JSON, or an
      # optionalDependency naming a version nothing built. npm versions are
      # immutable, so every one of those can only be superseded afterwards.
      - name: Lay out the packages
        run: ./scripts/npm-pack.sh "${{ needs.guard.outputs.version }}" dist dist/npm

      # Pack before publish, and assert the binary is IN the tarball. `files`
      # narrows what ships, and a package whose payload was excluded still
      # publishes cleanly — it fails later, on somebody's machine, at their first
      # commit.
      - name: The tarball actually carries the binary
        run: |
          set -euo pipefail
          cd dist/npm/amont-linux-x64-gnu
          # Listed to a file, THEN grepped — never `tar … | grep -q`. `grep -q`
          # exits at the first match and closes the pipe, tar takes EPIPE, and
          # under `pipefail` that is a failed step reported as
          # `tar: stdout: write error`. BSD tar tolerates it, GNU tar does not,
          # so it passed on macOS locally and failed the release on ubuntu.
          npm pack --silent > /tmp/packed
          tar tzf "$(cat /tmp/packed)" > /tmp/contents
          grep -qx 'package/bin/amont' /tmp/contents
          echo "the linux-x64-gnu tarball carries bin/amont"

      - name: Publish platform packages, then amont
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set for this environment."
            exit 1
          fi

          # Say WHO the token is before using it. A publish that 403s tells you
          # nothing about whether the token was rejected outright or accepted
          # and then refused a particular action — and those have completely
          # different fixes. One call separates them, before anything is
          # written.
          if who=$(npm whoami 2>&1); then
            echo "authenticated as $who"
          else
            echo "::error::the token does not authenticate: $who"
            echo "::error::Create a new one and re-run: gh secret set NPM_TOKEN --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi

          # ORDER IS LOAD-BEARING. `amont` declares each platform package at this
          # exact version, and npm validates that a dependency version exists at
          # publish time — so publishing `amont` first fails the whole job, and
          # publishing it first SUCCESSFULLY would be worse: an immutable version
          # nobody can install.
          #
          # Idempotent on "already published" for the same reason publish-crates
          # is: the usual reason to re-run a release is that a LATER step failed.
          publish() {
            local dir="$1"
            echo "→ publishing $(basename "$dir")"
            if out=$(npm publish --access public --provenance "$dir" 2>&1); then
              printf '%s\n' "$out"
            else
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qiE "cannot publish over|previously published|EPUBLISHCONFLICT"; then
                echo "  already published — continuing"
              elif printf '%s' "$out" | grep -q "E403"; then
                # Every one of these packages is created by its FIRST publish,
                # and creating a package is a different permission from updating
                # one. npm says only "You may not perform that action with these
                # credentials", which sends people to check the secret is set —
                # it is, or `npm whoami` above would have failed.
                echo "::error::403 creating $(basename "$dir"). The token authenticates but may not CREATE packages."
                echo "::error::These are all first publishes, so that is the permission being refused:"
                echo "::error::  · granular token — 'Packages and scopes' must be Read and write on ALL packages."
                echo "::error::    Selecting individual packages cannot work here: they do not exist yet."
                echo "::error::  · classic token — must be Automation (Read-only cannot publish; Publish prompts for 2FA)."
                echo "::error::Then re-run without a new tag: gh workflow run release.yaml --ref ${GITHUB_REF_NAME}"
                exit 1
              else
                echo "::error::publishing $(basename "$dir") failed"
                exit 1
              fi
            fi
          }

          for dir in dist/npm/amont-*; do publish "$dir"; done
          publish dist/npm/amont

          echo "### Published to npm" >> "$GITHUB_STEP_SUMMARY"
          echo "\`npm i -D amont\` — v${{ needs.guard.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  # IMMUTABLE, so a bad publish can only be yanked and superseded, never fixed.
  # The binaries are the cheaper thing to get wrong.
  publish-crates:
    name: publish to crates.io
    needs: [guard, build, publish]
    # Keyed on the ref being a TAG, not on dry_run — so a `workflow_dispatch`
    # against an existing tag (`gh workflow run release.yaml --ref v1.0.0`)
    # publishes the crates without re-creating a GitHub release that already
    # exists. That is the resume path when a publish failed for a reason
    # outside this repository, which is exactly how v1.0.0 went: crates.io
    # refuses any upload from an account with no verified email address, and
    # says so with a 400 no amount of CI can fix.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Order is a dependency order, not a preference: `amont` depends on
      # `amont-runtime` and crates.io resolves that by VERSION, so the
      # dependency has to exist in the index before the dependent is accepted.
      # `amont-fleet` depends on the runtime too.
      #
      # Each publish is skipped when that exact version is already on crates.io,
      # so re-running a release after a partial failure resumes instead of
      # failing on "crate version already uploaded".
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set for this environment."
            exit 1
          fi

          # No index polling of our own, and no pre-flight "is it already
          # there?" API call. Both were mine and both were wrong:
          #
          #   * cargo ALREADY waits for the upload to become available — the
          #     run log reads "waiting for X to be available at registry" then
          #     "Published X". Polling on top of that was redundant.
          #   * the crates.io API rate-limits datacenter IPs, so the poll saw
          #     non-200 for a crate that had just published successfully and
          #     failed the job ten minutes later. amont-runtime 1.0.1 was
          #     live the whole time.
          #
          # Idempotency comes from cargo's own answer instead. Re-running a
          # release must not fail on a crate that is already up, and "already
          # uploaded" is exactly that answer — anything else is a real failure.
          for crate in amont-runtime amont amont-fleet; do
            echo "→ publishing $crate $VERSION"
            if out=$(cargo publish -p "$crate" 2>&1); then
              printf '%s\n' "$out"
            else
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qiE "already (been )?uploaded|already exists"; then
                echo "  $crate $VERSION was already published — continuing"
              else
                echo "::error::publishing $crate failed"
                exit 1
              fi
            fi
          done

          echo "### Published to crates.io" >> "$GITHUB_STEP_SUMMARY"
          echo "\`cargo install amont\` — v$VERSION" >> "$GITHUB_STEP_SUMMARY"

  # The release's last manual step, retired. The tap formula was bumped by
  # hand four times in three days — copy a version, copy four sha256 lines,
  # push — and a transcription error there ships a formula brew refuses, or
  # worse, accepts. A release is not published until `brew upgrade` can see
  # it, so the release publishes it.
  #
  # Auth is a deploy key that can write to the TAP REPOSITORY and nothing
  # else (secret TAP_DEPLOY_KEY; the tap holds the matching public key) —
  # narrower than any PAT. The rewrite itself is scripts/bump-tap.py, which
  # asserts on every surprise rather than sedding hopefully, and `ruby -c`
  # proves the result is at least a formula before anything is pushed.
  publish-tap:
    name: publish to the homebrew tap
    needs: [guard, publish]
    # Keyed on the ref being a TAG exactly as publish-npm is, so a
    # workflow_dispatch against an existing tag can resume this too. The
    # push step's nothing-to-commit path makes that resume a no-op when the
    # tap already carries the version.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # From the PUBLISHED release, not from this run's artifacts: the
      # formula must name the bytes an installer will actually download,
      # and reading them back from the release asserts they are there.
      - name: Download the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --pattern SHA256SUMS

      - name: Clone the tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:fredericrous/homebrew-tap.git tap

      - name: Rewrite the formula
        run: |
          set -euo pipefail
          python3 scripts/bump-tap.py "$VERSION" SHA256SUMS tap/Formula/amont.rb
          ruby -c tap/Formula/amont.rb

      - name: Push
        run: |
          set -euo pipefail
          cd tap
          if git diff --quiet; then
            echo "the tap already carries $VERSION — nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/amont.rb
          git commit -m "chore: amont $VERSION"
          git push origin HEAD
          echo "### Published to the homebrew tap" >> "$GITHUB_STEP_SUMMARY"
          echo "\`brew upgrade fredericrous/tap/amont\` — v$VERSION" >> "$GITHUB_STEP_SUMMARY"
