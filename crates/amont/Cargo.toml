[package]
name = "amont"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Inherited from [workspace.package]: 1.74, verified against the toolchain
# rather than asserted. See the workspace manifest.
rust-version.workspace = true
description = "Opinionated git hooks that judge what you are committing, not what is on disk"
readme = "../../README.md"
keywords = ["git", "git-hooks", "pre-commit", "hooks", "lint"]
categories = ["development-tools", "command-line-utilities"]

# Only the runtime, which itself has none. See crates/amont-runtime.
[features]
# Forwards the runtime's failure injection to the binary the tests spawn.
test-hooks = ["amont-runtime/test-hooks"]

[dependencies]
# `version` beside `path`: cargo uses the path locally and crates.io uses the
# version, so publishing without it produces a crate nobody can build.
amont-runtime.workspace = true

# Test-only: asserting on parsed JSON structure rather than substrings for
# `list --json`. Does not touch the shipped binary — check-no-deps.sh's
# `--edges normal` excludes dev-dependencies, and CI verifies that directly.
#
# This does mean `cargo test` on the commit-path crates needs a registry and a
# newer cargo than 1.74; the `msrv` job runs `cargo check`, not `cargo test`,
# for exactly that reason. The floor is a claim about the SHIPPED code.
[dev-dependencies]
serde_json = "1"
# The binary the integration tests spawn is built with `test-hooks`: its
# test-only knobs (the clock scale, failure injection) exist in every
# `cargo test` build and in no `cargo build`. Resolver 2 unifies a
# dev-dependency's features only while dev-dependencies are being built.
amont-runtime = { path = "../amont-runtime", features = ["test-hooks"] }
