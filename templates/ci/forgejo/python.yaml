# The CI backstop for a Python repository, Forgejo Actions edition — the same
# tools amont runs locally, called directly, in a python container. Copy into
# .forgejo/workflows/ and prune what you don't use.
# See https://fredericrous.github.io/amont/ci.html
name: checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  python:
    runs-on: docker
    container:
      image: python:3.12
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: pip install ruff pyright pytest
      - run: ruff check . # pre-commit-ruff
      - run: pyright # pre-commit-pyright — delete if unconfigured
      - run: pytest # pre-push-pytest

  # pre-push-audit-python's split: advisory on branches, blocking on a v* release.
  audit:
    runs-on: docker
    container:
      image: python:3.12
    timeout-minutes: 10
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
