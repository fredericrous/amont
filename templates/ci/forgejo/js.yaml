# The CI backstop for a JS/TS repository, Forgejo Actions edition — the same
# tools amont runs locally, called directly, in a node container. Copy into
# .forgejo/workflows/ and prune what you don't use.
# See https://fredericrous.github.io/amont/ci.html
name: checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  js:
    runs-on: docker
    container:
      image: node:lts
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      # amont.attest: when every pre-push block gate passed locally, amont
      # left a SIGNED note (refs/notes/amont-attest) on the tree it tested.
      # This step verifies that note and reports which gates it covers, so the
      # steps below can skip work already done — on THIS exact tree, on THIS
      # platform, by a key you committed as .forgejo/allowed_signers:
      #
      #   you@example.com namespaces="amont-attest" ssh-ed25519 AAAA…
      #
      # Fail-open by construction: any failure reports nothing covered and
      # every gated step simply runs. The most an attestation can ever save is
      # a redundant run. The action explains its reasoning in the log, which
      # matters because a non-skip is otherwise silent.
      #
      # amont still does not run in CI. This is a separate, single-purpose
      # verifier: https://github.com/fredericrous/attest — which is also where
      # verify.sh lives if you would rather inline the shell than depend on an
      # action.
      - id: attest
        uses: https://github.com/fredericrous/attest@v1
      - run: npm ci
      - run: npx --no-install eslint --max-warnings 0 . # pre-commit-lint-js — delete if no eslint config
      # pre-push-run-tests-js runs whichever gate scripts the package defines,
      # cheapest first; --if-present mirrors "only what the repo declares".
      - run: npm run typecheck --if-present
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
      - run: npm run test:unit --if-present
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
      - run: npm run test --if-present
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}

  # pre-push-audit-js's split: advisory on branches, blocking on a v* release.
  audit:
    runs-on: docker
    container:
      image: node:lts
    timeout-minutes: 10
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: npm audit
