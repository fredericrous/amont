# The CI backstop for a Go repository, Forgejo Actions edition — the same
# tools amont runs locally, called directly, in a golang container. Copy into
# .forgejo/workflows/ and prune what you don't use.
# See https://fredericrous.github.io/amont/ci.html
name: checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  go:
    runs-on: docker
    container:
      image: golang:latest
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      # amont.attest: skip a test step only when a signed note proves its gate
      # already passed locally on EXACTLY this tree. Fail-open: any failure
      # leaves `covered` empty and the gated steps run. Requires
      # .forgejo/allowed_signers; full explanation in the js template and
      # https://fredericrous.github.io/amont/ci.html
      - id: attest
        run: |
          command -v ssh-keygen >/dev/null || exit 0
          git fetch origin '+refs/notes/amont-attest:refs/notes/amont-attest' 2>/dev/null || exit 0
          for c in HEAD HEAD^2; do
            note=$(git notes --ref amont-attest show "$c" 2>/dev/null) && break
          done
          [ -n "$note" ] || exit 0
          payload=$(printf '%s\n' "$note" | sed -n '/^$/q;p')
          sig=$(printf '%s\n' "$note" | sed -n '/^-----BEGIN SSH SIGNATURE-----$/,$p')
          [ -n "$sig" ] || exit 0
          [ "$(printf '%s\n' "$payload" | sed -n 1p)" = amont-attest-v1 ] || exit 0
          tree=$(printf '%s\n' "$payload" | awk '$1=="tree"{print $2}')
          [ -n "$tree" ] && [ "$tree" = "$(git rev-parse 'HEAD^{tree}')" ] || exit 0
          printf '%s\n' "$sig" >/tmp/amont-attest.sig
          printf '%s\n' "$payload" | ssh-keygen -Y verify \
              -f .forgejo/allowed_signers -I you@example.com \
              -n amont-attest -s /tmp/amont-attest.sig >/dev/null 2>&1 || exit 0
          echo "covered=$(printf '%s\n' "$payload" | awk '$1=="gates"{sub(/^gates */,""); print}')" >>"$GITHUB_OUTPUT"
      - run: test -z "$(gofmt -l .)" # pre-commit-gofmt
      - run: go vet ./... # pre-commit-go-vet
      - run: go test ./... # pre-push-go-test
        if: ${{ !contains(steps.attest.outputs.covered, 'pre-push-go-test') }}

  # pre-push-audit-go's split: advisory on branches, blocking on a v* release.
  audit:
    runs-on: docker
    container:
      image: golang:latest
    timeout-minutes: 10
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
