# The CI backstop for a Rust repository — the same tools amont runs locally,
# called directly. amont itself deliberately does not run in CI; see
# https://fredericrous.github.io/amont/ci.html for the reasoning and the
# mapping. Copy this file into .github/workflows/ and prune what you don't use.
name: checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check # pre-commit-cargo-fmt, locally
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings # pre-commit-clippy
      - run: cargo test --workspace --all-features # pre-push-cargo-test

  # pre-push-audit-rust's split, expressed natively: advisory on branches,
  # blocking when a v* tag is being released.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked # cache ~/.cargo/bin to skip this
      - run: cargo audit
