# The CI backstop for a Go repository — the same tools amont runs locally,
# called directly. amont itself deliberately does not run in CI; see
# https://fredericrous.github.io/amont/ci.html. Copy into .github/workflows/
# and prune what you don't use.
name: checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # amont.attest: when every pre-push block gate passed locally, amont
      # left a SIGNED note (refs/notes/amont-attest) on the tree it tested.
      # This step verifies that note and reports which gates it covers, so the
      # steps below can skip work already done — on THIS exact tree, on THIS
      # platform, by a key you committed as .github/allowed_signers:
      #
      #   you@example.com namespaces="amont-attest" ssh-ed25519 AAAA…
      #
      # Fail-open by construction: any failure reports nothing covered and
      # every gated step simply runs. The most an attestation can ever save is
      # a redundant run. The action explains its reasoning in the log, which
      # matters because a non-skip is otherwise silent.
      #
      # amont still does not run in CI. This is a separate, single-purpose
      # verifier: https://github.com/fredericrous/attest — which is also where
      # verify.sh lives if you would rather inline the shell than depend on an
      # action.
      - id: attest
        uses: fredericrous/attest@v1
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)" # pre-commit-gofmt
      - run: go vet ./... # pre-commit-go-vet
      - run: go test ./... # pre-push-go-test
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-go-test') }}

  # pre-push-audit-go's split: advisory on branches, blocking on a v* release.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
