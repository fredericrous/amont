# amont's own checks, declared for amont.
#
# ONE line, and it is a placement decision rather than a new check: amont
# already owns `pre-push-cargo-test`, and declaring its short name here at
# pre-commit moves the suite off the push path. The push side then defers to
# the per-commit stamps this earns, saying so:
#
#     ✓ cargo-test gated at commit instead — not repeating it here
#
# WHY move it. `git push` opens its connection to the remote, reads the
# remote refs — which is where pre-push's own stdin comes from — and only
# then calls the hook. The connection is already open and idles for the
# length of the gate. GitHub closed it twice on the v1.20.0 tag push, after
# seven minutes of cargo test, and reported "Connection reset by peer" — a
# network fault, apparently, rather than the wait that caused it. The only
# way past was `git push --no-verify`, which switches off the secrets scan
# and branch-protect too. ssh keepalive does not help: ServerAliveInterval
# was already 60 on that machine and the remote reset it anyway.
#
# WHAT IT COSTS, because it is a trade and not a free win: every commit
# touching a .rs file now pays the suite. This repository commits far more
# often than it pushes, so that is the expensive side of the trade. It is
# accepted because the alternative was a push that could not complete
# without a blanket bypass.
#
# If it becomes intolerable, the honest options are `git config --add
# hook.skip pre-push-cargo-test` and leaning on CI — which docs/ci.md argues
# is the real backstop anyway — NOT a cheaper command on this line. The
# declaration IS the command, so `cargo test --lib` here would make the push
# gate defer to a weaker check than it would have run, and say nothing about
# the difference.
#
# A --no-verify commit earns no stamp and brings the push gate back, out
# loud. That is the whole safety property; see docs/checks.md, "Moving a
# gate entry earlier".

# stage       name        scope   severity  command
pre-commit    cargo-test  *.rs    block     cargo test --locked
