# Environment for every test binary cargo runs (ADR-0009).
#
# The integration tests spawn amont hundreds of times, often under amont's
# own gate on a loaded workstation. Two host-level knobs must not reach
# them from the machine:
#
# - AMONT_HOST_SLOT=held: a fixture's heavy check would otherwise queue on
#   the real host slots, behind the very suite that is running it.
# - AMONT_IDLE_LOAD_SCALE=1: every kill-time bound in timing.rs would
#   otherwise stretch with the machine's load average.
#
# The slot and load fixtures remove both and set their own. The test
# `cargo_pins_the_host_knobs_for_tests` in host_slots.rs fails if this file
# stops reaching the tests.
[env]
AMONT_HOST_SLOT = "held"
AMONT_IDLE_LOAD_SCALE = "1"
# Shortens amont's own fixed waits by this factor in the test build only
# (crates/amont-runtime/src/clock.rs), and the fixtures' sleeps with them
# (`common::secs`): a quiet run's log line, land's re-read, the tree-lint
# slack and wait. The kill budgets are not scaled; timing.rs proves them on
# the real clock.
AMONT_TEST_CLOCK_SCALE = "0.25"

# Quiet runs write an active-run entry for relais's pane, keyed by the Claude
# Code session (amont docs/quiet-runs.md). A test run by an agent inherits
# that agent's session, and its fixtures would appear in the person's live
# pane; an empty session writes no entry, and any entry stays under target/.
# `quiet_entries_never_reach_the_real_state_dir` in crates/amont-runtime/src/capture.rs fails if this
# stops reaching the tests.
CLAUDE_CODE_SESSION_ID = { value = "", force = true }
QUIET_ACTIVE_DIR = { value = "target/quiet-active-test", relative = true, force = true }
